[build-system]
requires = ["setuptools>=84.0.0", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "contextmap"
dynamic = ["version"]
description = "Research implementation for generating persistent 3D contextual map artifacts from robotic sensor data."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Alexandre Tortoza" }
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# numpy is pinned below 2.4 because 2.4+ ships stub files using PEP 695
# `type` aliases, which mypy cannot parse while targeting python_version
# 3.11 (see [tool.mypy] below). Revisit once the project's floor moves to
# 3.12+ or mypy's stub handling improves.
dependencies = [
  "numpy<2.4",
]

[project.optional-dependencies]
ros1 = [
  "rosbags>=0.9,<1",
]
dev = [
  "build>=1.6.1",
  "mypy>=2.3.1",
  "pre-commit>=4.6.2",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.6",
  "rosbags>=0.9,<1",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
fallback_version = "0.0.0"
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["contextmap"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
