name: Bug report
description: Report an incorrect behavior or regression
title: "fix: "
labels:
  - "type: bug"
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest reproducible configuration, input, or sequence of steps.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Include logs, metrics, generated artifacts, screenshots, or relevant frame identifiers.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include commit SHA, Python version, hardware, model/backend versions, and dataset/source when relevant.
