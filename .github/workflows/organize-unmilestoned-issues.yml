name: Organize current unmilestoned issues

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/organize-unmilestoned-issues.yml

permissions:
  issues: write
  contents: read

jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - name: Create thematic milestones and assign current issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          resolve_milestone() {
            local title="$1"
            local description="$2"
            local milestone_number

            milestone_number="$(
              gh api --paginate "repos/$REPO/milestones?state=all&per_page=100" \
                --jq ".[] | select(.title == \"$title\") | .number" \
                | head -n1
            )"

            if [[ -z "$milestone_number" ]]; then
              milestone_number="$(
                gh api --method POST "repos/$REPO/milestones" \
                  -f title="$title" \
                  -f description="$description" \
                  --jq '.number'
              )"
              echo "created milestone #$milestone_number: $title"
            else
              echo "using milestone #$milestone_number: $title"
            fi

            printf '%s' "$milestone_number"
          }

          assign_issues() {
            local milestone_number="$1"
            shift
            for issue in "$@"; do
              gh api --method PATCH "repos/$REPO/issues/$issue" \
                -F milestone="$milestone_number" >/dev/null
              echo "assigned #$issue -> milestone #$milestone_number"
            done
          }

          scalability="$(
            resolve_milestone \
              "Pipeline Scalability & Artifact Infrastructure" \
              "Bound memory and I/O costs and converge shared artifact lifecycle primitives without changing scientific semantics."
          )"
          assign_issues "$scalability" 512 513 515 516 519 622

          interaction="$(
            resolve_milestone \
              "Interaction-aware Relation Candidate Discovery" \
              "Evaluate provenance-preserving semantic interaction priors for relation candidate discovery while keeping geometry-only baselines and relation decisions separate."
          )"
          assign_issues "$interaction" 543 546 547 548 549 550 551 552

          perception_reliability="$(
            resolve_milestone \
              "Perception Reliability & Auditability" \
              "Investigate semantic nondeterminism and make perception failures and per-region evidence auditable without weakening evidence or provenance contracts."
          )"
          assign_issues "$perception_reliability" 556 559 560

          aggregation="$(
            resolve_milestone \
              "Inter-scan Geometry Aggregation" \
              "Define and evaluate provenance-preserving inter-scan spatial aggregation as a derived representation before any canonical adoption."
          )"
          assign_issues "$aggregation" 623 624

          perception_experiment="$(
            resolve_milestone \
              "Perception Backend & Evidence Ablation Experiment" \
              "Factorized experiments for perception backends, native tasks, prompts, VLM evidence views, scene context, semantic scoring, and visual-token/VRAM budgets."
          )"
          assign_issues "$perception_experiment" 214 215 216 571 574 575

          audit="$(
            resolve_milestone \
              "Audit Hardening" \
              "Hardening work derived from the 2026-09 full technical audit."
          )"
          assign_issues "$audit" 627 628 629 630 631 633 634 635

          echo "Current issues intentionally left without milestone because their tracked work is already completed or historical: #511 #514 #517 #518 #557 #558 #561"
