name: Bootstrap milestones

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-milestones.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  create-milestones:
    runs-on: ubuntu-latest
    steps:
      - name: Create repository milestones
        uses: actions/github-script@v8
        with:
          script: |
            const milestones = [
              {
                title: 'Architecture & Module Boundaries',
                description: 'Define the modular pipeline, capability ownership, public boundaries, dependency rules, composition root, and architecture guardrails for Solution 1.'
              },
              {
                title: 'Ingestion',
                description: 'Define and validate canonical sensor input, synchronization, calibration, provenance, and real-source adapters.'
              },
              {
                title: 'Visual Perception Core',
                description: 'Define the public visual evidence boundary and orchestration independent of concrete region, feature, and semantic backends.'
              },
              {
                title: 'Region Discovery',
                description: 'Implement and validate region discovery behind the visual-perception boundary, including masks, geometry, confidence, and provenance.'
              },
              {
                title: 'Feature Extraction',
                description: 'Implement and validate backend-agnostic visual feature extraction and the metadata required to compare and consume embeddings safely.'
              },
              {
                title: 'Semantic Interpretation',
                description: 'Implement and validate semantic interpretation of visual evidence while preserving uncertainty, alternatives, and provenance.'
              },
              {
                title: 'State Estimation',
                description: 'Define pose, trajectory, coordinate-frame, uncertainty, and provenance contracts independent of a specific localization implementation.'
              },
              {
                title: 'Geometric Mapping',
                description: 'Build and maintain persistent 3D geometry with stable spatial references and explicit coordinate-frame semantics.'
              },
              {
                title: 'Sensor Association',
                description: 'Associate 2D visual evidence with persistent 3D geometry using calibration, transforms, and explicit spatial provenance.'
              },
              {
                title: 'Point Representation',
                description: 'Define and validate backend-agnostic 3D feature representations and their relationship with spatial observations.'
              },
              {
                title: 'Semantic Fusion',
                description: 'Fuse temporal and multi-view semantic evidence while preserving confidence, ambiguity, contradictions, and provenance.'
              },
              {
                title: 'Semantic Mapping — Entity Model',
                description: 'Define persistent contextual entities, identifiers, geometry references, semantic evidence, and lifecycle invariants.'
              },
              {
                title: 'Semantic Mapping — Entity Resolution',
                description: 'Associate repeated observations with persistent entities and define deterministic merge/update behavior.'
              },
              {
                title: 'Spatial Relations',
                description: 'Define and validate contextual and spatial relations between persistent entities using explicit evidence and geometry.'
              },
              {
                title: 'Context Map Artifact — Schema',
                description: 'Define the first versioned, backend-independent schema for the portable contextual map artifact.'
              },
              {
                title: 'Context Map Artifact — Serialization & Validation',
                description: 'Implement artifact serialization, deserialization, integrity validation, compatibility checks, and deterministic fixtures.'
              },
              {
                title: 'Runtime & Configuration',
                description: 'Implement the composition root, configuration model, backend selection, pipeline orchestration, and CLI execution path.'
              },
              {
                title: 'Evaluation & Reference Set',
                description: 'Establish versioned reference fixtures, map-quality metrics, reproducible evaluation, and regression criteria.'
              },
              {
                title: 'End-to-End Validation',
                description: 'Validate the complete sensor-to-artifact path with deterministic fixtures and at least one real recorded sequence.'
              },
              {
                title: 'v0.1.0',
                description: 'Release gate for the first coherent and reproducible Solution 1 validation release.'
              }
            ];

            const { owner, repo } = context.repo;
            const existing = await github.paginate(
              github.rest.issues.listMilestones,
              { owner, repo, state: 'all', per_page: 100 }
            );
            const existingByTitle = new Map(existing.map((m) => [m.title, m]));
            const result = [];

            for (const milestone of milestones) {
              const current = existingByTitle.get(milestone.title);
              if (current) {
                core.info(`Exists #${current.number}: ${milestone.title}`);
                result.push({ number: current.number, title: milestone.title, status: 'existing' });
                continue;
              }

              const { data: created } = await github.rest.issues.createMilestone({
                owner,
                repo,
                title: milestone.title,
                description: milestone.description,
                state: 'open'
              });

              core.info(`Created #${created.number}: ${created.title}`);
              result.push({ number: created.number, title: created.title, status: 'created' });
            }

            await core.summary
              .addHeading('Milestones')
              .addTable([
                [{ data: '#', header: true }, { data: 'Title', header: true }, { data: 'Status', header: true }],
                ...result.map((item) => [String(item.number), item.title, item.status])
              ])
              .write();
